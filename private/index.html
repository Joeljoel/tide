<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111722">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tide">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="An uncluttered qBittorrent WebUI for iPhone and foldable screens.">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/tide-v1.0.5.css">
  <title>Tide</title>
</head>
<body>
  <div id="tideLargeViewportProbe" aria-hidden="true"></div>
  <div id="app" class="shell">
    <header class="topbar" aria-label="Tide and transfer speeds">
      <button type="button" class="brand-wrap brand-action" data-action="info" aria-label="About Tide" title="About Tide">
        <img class="brandmark" src="icon.png" alt="" width="35" height="35">
        <div class="brand">tide<span class="brand-dot">.</span></div>
      </button>
      <div class="header-rates" aria-label="Global transfer speeds">
        <div class="header-rate"><span class="header-arrow down" aria-hidden="true">↓</span><span class="header-rate-value" id="totalDownload">—</span></div>
        <div class="header-rate"><span class="header-arrow up" aria-hidden="true">↑</span><span class="header-rate-value" id="totalUpload">—</span></div>
      </div>
      <div class="desktop-tools" id="desktopTools" role="toolbar" aria-label="Torrent controls">
        <label class="desktop-search" aria-label="Search torrents">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="desktopSearchInput" type="search" placeholder="Search torrents" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Search torrents">
        </label>
        <button class="desktop-tool" type="button" data-action="refresh" aria-label="Refresh torrents" title="Refresh torrents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.3 10.3a7.65 7.65 0 1 0-1.55 6.45"/><path d="M19.3 4.9v5.4h-5.4"/></svg><span>Refresh</span></button>
        <button class="desktop-tool desktop-add" type="button" data-action="add" aria-label="Add torrent" title="Add torrent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add torrent</span></button>
      </div>
      <button type="button" class="header-settings-button" data-action="settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z"/><path d="m10.1 2.9-.4 1.8a7.8 7.8 0 0 0-1.5.9l-1.7-.6-2.1 3.6 1.3 1.2a8 8 0 0 0 0 1.8l-1.3 1.2 2.1 3.6 1.7-.6c.5.4 1 .7 1.5.9l.4 1.8h4l.4-1.8c.5-.2 1-.5 1.5-.9l1.7.6 2.1-3.6-1.3-1.2a8 8 0 0 0 0-1.8l1.3-1.2-2.1-3.6-1.7.6c-.5-.4-1-.7-1.5-.9l-.4-1.8h-4Z" transform="translate(0 1.1)"/></svg>
      </button>
      <span class="demo-tag" id="demoTag" hidden>Preview</span>
    </header>

    <div id="landscapeControlsSlot" class="landscape-controls-slot" aria-label="Torrents filters"></div>
    <div class="layout">
      <main class="list-panel">
        <span id="controlsHome" hidden></span>
        <div class="controls">
          <div class="filter-viewport">
            <div class="filter-row" id="filterRow" role="group" aria-label="Filter torrents">
              <button class="filter-chip active" data-filter="all">All</button>
              <button class="filter-chip" data-filter="downloading">Downloading</button>
              <button class="filter-chip" data-filter="stalled">Stalled</button>
              <button class="filter-chip" data-filter="completed">Completed</button>
              <button class="filter-chip" data-filter="paused">Paused</button>
              <button class="filter-chip" data-filter="seeding">Seeding</button>
            </div>
          </div>
          <button class="inline-sort" data-action="sort" aria-label="Sort torrents" title="Sort torrents">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span id="sortLabel">ETA</span>
          </button>
        </div>
        <div class="list-meta"><span id="listDescription">Torrents</span><span id="lastUpdated"></span></div>
        <div class="torrent-list" id="torrentList"><div class="empty-state"><div class="loader"></div><p>Connecting to qBittorrent…</p></div></div>
        <div id="searchKeyboardSpacer" aria-hidden="true"></div>
      </main>
      <aside class="detail-panel" id="detailPanel" aria-label="Torrent details">
        <div id="detailInner" class="detail-inner"><div class="detail-placeholder"><span class="placeholder-icon">≋</span><h2>Select a torrent</h2></div></div>
      </aside>
    </div>

    <!-- Desktop actions float above the viewport, never inside the list flow. -->
    <div class="desktop-selectionbar" id="desktopSelectionBar" role="toolbar" aria-label="Selected torrent actions" hidden></div>
    <!-- One right-edge rail: global, selected, and detail states are mutually exclusive. -->
    <nav class="action-rail" id="actionRail" aria-label="Tide controls" data-mode="global">
      <div id="railButtons" class="rail-buttons"></div>
    </nav>
    <!-- Mobile search shares the floating control layer with the right-edge action rail. -->
    <div class="search-wrap bottom-search" id="searchWrap" role="search" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="searchInput" type="search" placeholder="Search torrents" enterkeyhint="search" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Search torrents">
    </div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="modal-mount" id="modalMount"></div>
    <div class="toast" role="status" aria-live="polite" id="toast"></div>
    <pre id="viewportDiagnostics" class="viewport-diagnostics" hidden></pre>
  </div>
  <script src="js/tide-v1.0.5.js" defer></script>
</body>
</html>
