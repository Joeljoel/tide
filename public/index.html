<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111722"><title>Tide · Sign in</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0c121b;color:#f7fafb;padding:20px}.login{width:min(100%,420px);padding:28px;border-radius:25px;background:#243442;border:1px solid #ffffff20}.login h1{margin:0 0 12px;font-size:27px}.login p{color:#aab9c3}label{display:block;margin:16px 0 7px;font-size:14px}input,button{font:inherit;width:100%;padding:13px;border-radius:13px;border:1px solid #ffffff28}input{background:#141f29;color:white;font-size:16px}button{margin-top:24px;border:0;background:#b0e7c4;color:#1a3526;font-weight:700}.error{min-height:18px;color:#ffaaa9;font-size:13px}</style></head><body><main class="login"><h1>tide.</h1><p>Sign in with your qBittorrent credentials.</p><form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="error" class="error" role="alert"></p></form></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),err=document.getElementById('error');b.disabled=true;err.textContent='';try{const res=await fetch('api/v2/auth/login',{method:'POST',credentials:'same-origin',body:new URLSearchParams({username:document.getElementById('username').value,password:document.getElementById('password').value})});const t=(await res.text()).trim();if(!res.ok||!/^ok\.?$/i.test(t))throw Error('Sign-in unsuccessful. Check your credentials.');location.replace('./');}catch(ex){err.textContent=ex.message||'Unable to sign in';b.disabled=false;}});</script></body></html>
