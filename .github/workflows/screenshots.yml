name: Refresh README screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "private/**"
      - "scripts/capture_screenshots.py"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture simulated legal-content screenshots
        run: python scripts/capture_screenshots.py
      - name: Commit changed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: update legal-demo screenshots [skip ci]"
            git push
          fi
