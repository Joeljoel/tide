name: Preview PR 10 without updating Tide main

on:
  push:
    branches:
      - feature/iphone-duo-posture-panes-20261117
    paths:
      - demo/**
      - private/**
      - version.json
      - .github/workflows/pr10-pages-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tide-pages-preview-pr10
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR 10 feature branch
        uses: actions/checkout@v4
      - name: Check out unchanged main for stable demo root
        uses: actions/checkout@v4
        with:
          ref: main
          path: _stable_source
          persist-credentials: false
      - name: Build stable demo from main (not PR)
        shell: bash
        run: |
          set -euo pipefail
          python3 _stable_source/demo/build.py --output "$(pwd)/_site"
      - name: Check out frozen PR 7 preview
        uses: actions/checkout@v4
        with:
          ref: b23900a330aba92f9030bcc76a722c41d1210e17
          path: _pr7_source
          persist-credentials: false
      - name: Retain existing PR 7 preview
        run: python3 _pr7_source/demo/build.py --output "$(pwd)/_site/previews/pr-7"
      - name: Check out frozen PR 9 preview
        uses: actions/checkout@v4
        with:
          ref: dbf3674b6214fc594c9e38aab87da92c054e2a74
          path: _pr9_source
          persist-credentials: false
      - name: Retain existing PR 9 preview
        run: python3 _pr9_source/demo/build.py --output "$(pwd)/_site/previews/pr-9"
      - name: Build PR 10 into its own subdirectory
        run: python3 demo/build.py --output "$(pwd)/_site/previews/pr-10"
      - name: Check scripts and offline-only demo
        shell: bash
        run: |
          set -euo pipefail
          preview="_site/previews/pr-10"
          node --check "$preview/showcase.js"
          node --check "$preview/app/js/tide-posture-v1.4.0-beta.1.js"
          node --check "$preview/app/js/tide-v1.3.0.js"
          grep -Fq 'const demo = true;' "$preview/app/js/tide-v1.3.0.js"
          grep -Fq "connect-src 'none'" "$preview/app/index.html"
          grep -Fq 'partially-folded-portrait' "$preview/showcase.js"
          test -f "$preview/app/demo-pose.css"
      - name: Install browser smoke-test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Test interactive demo and capture screenshots
        run: python3 demo/test_showcase.py _site/previews/pr-10 demo-preview-screenshots
      - name: Upload PR 10 visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-pr10-preview-screenshots
          path: demo-preview-screenshots/
          if-no-files-found: ignore
      - name: Upload Pages site with unchanged stable root
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: tide-pr10-preview
      url: ${{ steps.deployment.outputs.page_url }}/previews/pr-10/
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy stable root plus PR 10 preview
        id: deployment
        uses: actions/deploy-pages@v4
