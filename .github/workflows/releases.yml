name: Publish Tide releases

on:
  push:
    branches: [main]
    paths:
      - version.json
      - .github/workflows/releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish version from version.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            prerelease="${prerelease%%+*}"
            IFS='.' read -ra ids <<< "$prerelease"
            for id in "${ids[@]}"; do
              if [[ "$id" =~ ^0[0-9]+$ ]]; then
                echo "Invalid SemVer prerelease identifier: $id" >&2
                exit 1
              fi
            done
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already published"
            exit 0
          fi
          title="Tide $version"
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if [[ "$version" == "1.1.0" ]]; then
            notes=$(cat <<'EOF'
          ## What's new in Tide 1.1.0
          
          - New Settings window with **Tide**, **qBittorrent**, and **About** tabs.
          - Light, dark, and system appearance modes.
          - qBittorrent preference controls with an explicit Save changes action.
          - SemVer-aware About → Check updates.
          - On unfolded iPhone Duo portrait, Settings sits between Add and Refresh in the bottom action row; other layouts retain the header button.
          - Improved light-mode contrast and clearance from iPhone Duo system indicators.
          
          ## Installation
          
          Download the Source code ZIP below, extract it, and configure qBittorrent's alternative Web UI to the folder containing `private/` and `public/`. Existing installs can replace their Tide files and reopen the PWA. See the README for full instructions.
          EOF
            )
          elif [[ "$version" == "1.2.0" ]]; then
            notes=$(cat <<'EOF'
          ## What's new in Tide 1.2.0
          
          - Automatic left/right control placement in the iPhone Duo inner Split View.
          - Left-side rail and matching content/header gutter when Tide occupies the left half.
          - Existing right-side controls preserved in the right half and other layouts.
          - Dynamic safe-area detection when moving between Split View halves.
          
          ## Installation
          
          Download the Source code ZIP, replace your Tide files, and reopen the PWA. See the README for full setup instructions.
          EOF
            )
          elif [[ "$version" == "1.2.1" ]]; then
            notes=$(cat <<'EOF'
          ## What's new in Tide 1.2.1
          
          - Fixed the bottom gap in both portrait and landscape on the iPhone Duo's full unfolded inner display.
          - Restored full-height layout after repeated orientation changes using the device-verified `100vh` correction.
          - Kept folded, Split View, desktop, and keyboard-editing behaviour unchanged.
          
          ## Installation
          
          Download the Source code ZIP, replace your existing Tide files, and reopen the PWA. See the README for setup instructions.
          EOF
            )
          elif [[ "$version" == "1.3.0" ]]; then
            notes=$(cat <<'EOF'
          ## What's new in Tide 1.3.0

          - In folded landscape on iPhone Duo, Tide moves the logo clear of the top-left camera or raises Search, Refresh, and Add clear of the bottom-right camera.
          - The interactive demo includes animated folding, rotation, and Split View with a consistent device scale.

          ## Installation

          Download the Source code ZIP, replace your existing Tide files, and reopen the PWA. See the README for setup instructions.
          EOF
            )
          elif [[ "$version" == "1.4.0" ]]; then
            notes=$(cat <<'EOF'
          ## What's new in Tide 1.4.0

          - **Device posture support for iPhone Duo:** Tide detects partially folded portrait and landscape states and adapts the torrent list, Details, and Settings to the hinge.
          - In partially folded landscape, torrent cards use a two-column layout and Details can sit alongside the list, with Settings on the right.
          - In partially folded portrait, the torrent list stays visible above Details in a 50/50 split.
          - In fully unfolded portrait, the torrent list remains visible in the top 35% while Details occupies the lower 65%. The divider animates smoothly between the 50/50 and 35/65 layouts as the device folds or unfolds.
          - **Updated interactive demo:** Folded, partially folded and fully open device states, 3D hinge animation, rotation, Split View, consistent bezel styling, and transition-only screen blur.
          
          ### Experimental Safari support
          
          Device posture detection is currently supported on **iOS 27.3 Beta 2** with Safari's optional **Device Posture API** feature flag enabled under **Settings → Apps → Safari → Advanced → Feature Flags**. Enable **Viewport Segments API** there as well for hinge-aware viewport geometry.
          
          The Device Posture API remains experimental, so availability may change with iOS/Safari updates.
          
          ### Installation
          
          Download the **Source code ZIP** below, extract it, and configure qBittorrent's alternative Web UI to the directory containing `private/` and `public/`. Existing installs can replace their Tide files and reopen the PWA. See the README for full instructions.
          EOF
            )
          elif [[ "$version" == "1.4.1" ]]; then
            notes=$(cat <<'EOF'
          ## What's fixed in Tide 1.4.1

          - Fixed torrent selection while viewing Details in portrait on the iPhone Duo.
          - When Details is open in partially folded (50/50) or fully unfolded (35/65) portrait, tapping another torrent now switches Details to that torrent without closing the panel or starting a multi-selection.
          - When Details is closed, tapping multiple torrents still adds them to the selection as before.
          - The fix also preserves existing desktop and landscape Details navigation.

          Fixes #11.

          ## Installation

          Download the Source code ZIP, replace your existing Tide files, and reopen the PWA. See the README for installation instructions.
          EOF
            )
          else
            notes=$(printf '%s\n\n%s\n' \
              "Tide $version is a touch-first alternative qBittorrent WebUI, designed for the iPhone Duo and desktop." \
              "See the README for features and installation instructions.")
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            "${release_flags[@]}"
