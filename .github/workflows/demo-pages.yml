name: Build and deploy Tide demo

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - private/**
      - version.json
      - .github/workflows/demo-pages.yml
  pull_request:
    branches: [main]
    paths:
      - demo/**
      - private/**
      - version.json
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tide
        uses: actions/checkout@v4
      - name: Generate static demo
        run: python3 demo/build.py --output _site
      - name: Validate demo scripts and isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/showcase.js
          node --check "$(find _site/app/js -maxdepth 1 -name 'tide-v*.js' -print -quit)"
          grep -Fq 'const demo = true;' _site/app/js/tide-v*.js
          grep -Fq "connect-src 'none'" _site/app/index.html
          grep -Fq 'tide-demo-set-pose' _site/app/js/tide-v*.js
          test -f _site/.nojekyll
      # Temporary, separate public preview of PR #7. The normal site at
      # /tide/ remains built from main and is not replaced by PR code.
      - name: Check out PR #7 for preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: Joeljoel/tide
          # Pinned snapshot for visual review; this does not merge the PR.
          ref: a34ea8598a168da914dcd3b9bd8f41d5a67ef0b8
          path: _pr7_source
          persist-credentials: false
      - name: Build isolated PR #7 preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 _pr7_source/demo/build.py --output "$(pwd)/_site/previews/pr-7"
          node --check _site/previews/pr-7/showcase.js
          node --check "$(find _site/previews/pr-7/app/js -maxdepth 1 -name 'tide-v*.js' -print -quit)"
          grep -Fq 'Tide Demo Collection' _site/previews/pr-7/app/js/tide-v*.js
          grep -Fq "connect-src 'none'" _site/previews/pr-7/app/index.html
          test -s _site/previews/pr-7/assets/status-overlay.webp
          grep -Fq 'id="duoBtn"' _site/previews/pr-7/index.html
          grep -Fq 'content:"Home Screen"' _site/previews/pr-7/showcase.css
          grep -Fq 'id="foldBtn"' _site/previews/pr-7/index.html
          grep -Fq 'id="splitBtn"' _site/previews/pr-7/index.html
          grep -Fq 'Tide Demo Collection' _site/previews/pr-7/app/js/tide-v*.js
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish static demo
        id: deployment
        uses: actions/deploy-pages@v4
