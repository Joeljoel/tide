<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Tide interactive preview">
  <title>Tide — Demo</title>
  <link rel="icon" type="image/png" href="app/icon.png">
  <link rel="stylesheet" href="showcase.css">
  <script src="showcase.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/Joeljoel/tide" aria-label="Tide on GitHub">
      <img src="app/icon.png" width="32" height="32" alt="">
      <strong>tide<span>.</span></strong>
    </a>
    <nav class="device-choices" aria-label="Display">
      <button id="desktopBtn" type="button" aria-pressed="true">Desktop</button>
      <button id="duoBtn" type="button" aria-pressed="false">Duo</button>
    </nav>
    <div class="duo-choices" id="duoChoices" hidden>
      <div class="fold-selector" role="radiogroup" aria-label="Duo fold position">
        <span class="fold-end-label">Folded</span>
        <div class="fold-stops">
          <button id="foldedBtn" type="button" role="radio" aria-label="Folded" aria-checked="true" data-fold-state="folded"><span></span></button>
          <button id="partialBtn" type="button" role="radio" aria-label="Partially folded" aria-checked="false" data-fold-state="partial"><span></span></button>
          <button id="unfoldedBtn" type="button" role="radio" aria-label="Unfolded" aria-checked="false" data-fold-state="unfolded"><span></span></button>
        </div>
        <span class="fold-end-label">Unfolded</span>
      </div>
      <button id="rotateBtn" type="button">Rotate <span aria-hidden="true">↻</span></button>
      <button id="splitBtn" type="button" hidden>Split</button>
      <button id="shiftBtn" type="button" hidden>Move Tide right</button>
    </div>
    <a class="github-link" href="https://github.com/Joeljoel/tide" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">GitHub ↗</a>
  </header>

  <main>
    <div class="preview-meta">
      <span id="poseName">Desktop</span>
      <span id="poseDimensions">1280 × 800</span>
      <span class="preview-note" id="previewNote">Interactive preview · v1.4.0-beta.1</span>
      <button id="resetDemo" type="button" title="Reset sample torrents">↺ Reset</button>
    </div>
    <div class="stage" id="stage">
      <div class="frame-holder" id="frameHolder">
        <div class="device-frame" id="deviceFrame" data-pose="desktop">
          <div class="fold-near-plane" id="foldNearPlane">
            <div class="fold-near-viewport" id="foldNearViewport">
              <div class="device-screen" id="deviceScreen">
            <div class="duo-panel tide-panel" id="tidePanel">
              <iframe id="tidePreview" title="Interactive Tide demo" src="app/index.html?demo=1&amp;pose=desktop"
                loading="eager" referrerpolicy="no-referrer"></iframe>
            </div>
            <div class="duo-panel home-panel" id="homePanel">
              <img class="home-left" src="assets/home-left.webp" width="1010" height="1440" alt="iPhone Duo Home Screen">
              <img class="home-right" src="assets/home-right.webp" width="1010" height="1440" alt="iPhone Duo Home Screen">
            </div>
            <div class="split-handle" aria-hidden="true"></div>
            <div class="fold-shade" id="foldShade" aria-hidden="true" hidden></div>
            <div class="system-ui" id="systemUi" aria-hidden="true">
              <div class="status-camera"></div>
              <div class="status-indicators">
                <div class="status-clock">
                  <svg class="status-location" viewBox="0 0 14 14" fill="currentColor">
                    <path d="M12.5 1 1.3 6.2a.8.8 0 0 0 .3 1.5h4.7v4.7a.8.8 0 0 0 1.5.3L13 1.9a.7.7 0 0 0-.5-.9Z"/>
                  </svg>
                  <span class="status-time">7:52</span>
                </div>
                <img class="status-connectivity" src="assets/status-connectivity.svg" width="42" height="42" alt="">
              </div>
            </div>
          </div>
            </div>
          </div>
            <!-- Two independently clipped physical planes share one *logical* viewport.
                 Only their wrappers rotate. Demo scrolling and actions are synchronized. -->
            <div class="fold-planes" id="foldPlanes">
              <div class="fold-flap" id="foldFlap">
                <div class="fold-flap-viewport" id="foldFlapViewport">
                  <iframe id="tideFoldPreview" title="Other side of Tide's foldable display"
                    src="app/index.html?demo=1&amp;pose=desktop" tabindex="-1"
                    loading="eager" referrerpolicy="no-referrer"></iframe>
                  <div class="fold-home-visual" aria-hidden="true"></div>
                  <div class="fold-flap-light" aria-hidden="true"></div>
                  <!-- The far indicator is cloned from the exact same status
                       markup used in the flat inner screen. -->
                  <div class="status-indicators fold-flap-status" aria-hidden="true"></div>
                </div>
                <div class="fold-interaction" id="foldInteraction" aria-label="Interact with the folded display"></div>
              </div>
            </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
