<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Interactive Tide demo with mock torrents and iPhone Duo display previews.">
  <title>Tide — Demo</title>
  <link rel="icon" type="image/png" href="app/icon.png">
  <link rel="stylesheet" href="showcase.css">
  <script src="showcase.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="https://github.com/Joeljoel/tide" aria-label="Tide on GitHub">
        <img src="app/icon.png" width="35" height="35" alt="">
        <strong>tide<span>.</span></strong>
      </a>
      <span class="demo-tag">DEMO</span>
      <nav class="pose-tabs" aria-label="Device preview">
        <button type="button" data-pose="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-pose="folded-portrait" aria-pressed="false">Outer portrait</button>
        <button type="button" data-pose="folded-landscape" aria-pressed="false">Outer landscape</button>
        <button type="button" data-pose="unfolded-portrait" aria-pressed="false">Inner portrait</button>
        <button type="button" data-pose="unfolded-landscape" aria-pressed="false">Inner landscape</button>
        <button type="button" data-pose="split-left" aria-pressed="false">Split left</button>
        <button type="button" data-pose="split-right" aria-pressed="false">Split right</button>
      </nav>
      <a class="github-link" href="https://github.com/Joeljoel/tide" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main>
    <div class="preview-meta">
      <span id="selectedLabel">Desktop</span>
      <span id="selectedDimensions">1280 × 800</span>
      <button type="button" id="resetDemo" title="Restore the demo torrents">↻ Reset</button>
    </div>

    <div class="stage" id="stage">
      <div class="frame-holder" id="frameHolder">
        <div class="device-frame" id="deviceFrame">
          <div class="device-screen" id="deviceScreen">
            <div class="duo-panel tide-panel" id="tidePanel">
              <iframe id="tidePreview" title="Interactive Tide demo" src="app/index.html?demo=1&amp;pose=desktop" loading="eager" referrerpolicy="no-referrer"></iframe>
            </div>
            <div class="hinge" id="hinge" aria-hidden="true"></div>
            <div class="duo-panel home-panel" id="homePanel" aria-label="Example iPhone Home Screen" role="img"></div>

            <!-- Drawn to match the right-side time, arrow and connectivity
                 placement in the supplied Duo screenshots. The home image
                 already contains its own status UI. -->
            <div class="system-status" id="systemStatus" aria-hidden="true">
              <img src="assets/status-overlay.webp" width="82" height="141" alt="">
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="page-footer">
      <span>Fake torrents and settings · No qBittorrent connection</span>
      <span id="scaleNote"></span>
      <span id="demoVersion">v1.2.1</span>
    </footer>
  </main>
</body>
</html>
