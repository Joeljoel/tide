<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Tide interactive preview">
  <title>Tide — Demo</title>
  <link rel="icon" type="image/png" href="app/icon.png">
  <link rel="stylesheet" href="showcase.css">
  <script src="showcase.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/Joeljoel/tide" aria-label="Tide on GitHub">
      <img src="app/icon.png" width="32" height="32" alt="">
      <strong>tide<span>.</span></strong>
    </a>
    <nav class="device-choices" aria-label="Display">
      <button id="desktopBtn" type="button" aria-pressed="true">Desktop</button>
      <button id="duoBtn" type="button" aria-pressed="false">Duo</button>
    </nav>
    <div class="duo-choices" id="duoChoices" hidden>
      <button id="foldBtn" type="button">Fold</button>
      <button id="rotateBtn" type="button">Rotate <span aria-hidden="true">↻</span></button>
      <button id="splitBtn" type="button" hidden>Split</button>
      <button id="shiftBtn" type="button" hidden>Move Tide right</button>
    </div>
    <a class="github-link" href="https://github.com/Joeljoel/tide" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">GitHub ↗</a>
  </header>

  <main>
    <div class="preview-meta">
      <span id="poseName">Desktop</span>
      <span id="poseDimensions">1280 × 800</span>
      <button id="resetDemo" type="button" title="Reset sample torrents">↺ Reset</button>
    </div>
    <div class="stage" id="stage">
      <div class="frame-holder" id="frameHolder">
        <div class="device-frame" id="deviceFrame" data-pose="desktop">
          <div class="device-screen" id="deviceScreen">
            <div class="duo-panel tide-panel" id="tidePanel">
              <iframe id="tidePreview" title="Interactive Tide demo" src="app/index.html?demo=1&amp;pose=desktop"
                loading="eager" referrerpolicy="no-referrer"></iframe>
            </div>
            <div class="duo-panel home-panel" id="homePanel" role="img" aria-label="iPhone Home Screen from the Duo screenshots"></div>
            <div class="system-ui" id="systemUi" aria-hidden="true">
              <div class="status-camera"><img src="assets/camera.webp" width="72" height="69" alt=""></div>
              <div class="status-horizontal"><span class="status-time">6:45</span><span class="status-signal"><span class="signal-arc">◔</span><span class="signal-bars">▂▄▆</span><span class="signal-network">5G</span></span></div>
              <img class="status-from-photo" src="assets/status-overlay.webp" alt="">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
